<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feria Peru Con Ciencia 2026 | CONCYTEC</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <link rel="stylesheet" href="style.css">
    <script src="config-tailwind.js"></script>

</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">

    <!-- --------------------------
    SECCION PARTICIPANTES
    -------------------------- -->
    <section id="participantes" class="py-8 md:py-8 bg-slate-100 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
            <div class="absolute -top-24 -right-24 w-96 h-96 bg-brand opacity-5 rounded-full blur-3xl"></div>
            <div class="absolute bottom-0 -left-24 w-96 h-96 bg-accent opacity-5 rounded-full blur-3xl"></div>
        </div>
        
        <div class="container mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 relative z-10">
            
            <div class="flex flex-col items-center mb-6">
                <h2 class="text-3xl md:text-4xl font-extrabold text-dark tracking-tight text-center uppercase">Expositores y Participantes</h2>
                <div class="w-20 h-1 bg-brand mt-4 rounded-full"></div>
            </div>
            
            
            <!-- Pestañas (Tabs) -->
            <div class="w-full mb-3">
                <div class="bg-slate-50 p-1.5 rounded-xl shadow-inner border border-slate-200 flex flex-wrap gap-8 justify-center md:justify-start w-full md:w-fit mx-auto ">
                    <button id="tab-pcc" class="tab-btn px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm transition-all duration-300 bg-brand text-white shadow-md flex items-center gap-1.5 flex-grow md:flex-grow-0 justify-center" data-tab="PCC">
                        <span class="text-base">🔬</span> Perú con Ciencia
                    </button>
                    <button id="tab-eureka" class="tab-btn px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm text-slate-500 hover:text-slate-800 transition-all duration-300 flex items-center gap-1.5 flex-grow md:flex-grow-0 justify-center" data-tab="EUREKA">
                        <span class="text-base">💡</span> Eureka
                    </button>
                    <button id="tab-ccyt" class="tab-btn px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm text-slate-500 hover:text-slate-800 transition-all duration-300 flex items-center gap-1.5 flex-grow md:flex-grow-0 justify-center" data-tab="CCYT">
                        <span class="text-base">🏫</span> Clubes de CyT
                    </button>
                </div>
            </div>
            
            <div class="grid lg:grid-cols-12 gap-6 md:gap-8 items-start w-full">
                
                <!-- Columna Izquierda: Listado y Controles -->
                <div class="lg:col-span-7 flex flex-col h-full min-w-0 w-full">
                    
                    <!-- Barra de Filtros Dinámicos -->
                    <div class="bg-slate-50 p-3 rounded-2xl shadow-sm border border-slate-200/60 mb-4 w-full flex flex-col gap-3">
                        <div class="flex flex-col xl:flex-row gap-3 items-center justify-between w-full">
                            
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 w-full xl:w-auto flex-grow">
                                <select id="filtro1" class="w-full bg-white text-xs md:text-sm border border-slate-200 rounded-lg px-3 py-2 font-medium text-slate-700 focus:outline-none focus:border-brand transition-all cursor-pointer truncate"></select>
                                <select id="filtro2" class="w-full bg-white text-xs md:text-sm border border-slate-200 rounded-lg px-3 py-2 font-medium text-slate-700 focus:outline-none focus:border-brand transition-all cursor-pointer truncate"></select>
                                <select id="filtro3" class="w-full bg-white text-xs md:text-sm border border-slate-200 rounded-lg px-3 py-2 font-medium text-slate-700 focus:outline-none focus:border-brand transition-all cursor-pointer truncate"></select>
                            </div>

                            <!-- Contador de Resultados -->
                            <div class="flex justify-end xl:w-auto shrink-0 w-full border-t xl:border-t-0 border-slate-200 pt-3 xl:pt-0">
                                <span class="text-[10px] font-bold text-dark bg-dark/5 px-3 py-2 rounded-lg whitespace-nowrap uppercase flex items-center gap-2">
                                    <span id="total-lista" class="font-black text-sm text-brand">0</span> Resultados
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Contenedor de Tarjetas -->
                    <div id="lista-contenedor" class="grid sm:grid-cols-2 gap-4 max-h-[500px] overflow-y-auto pr-2 mb-4 scroll-smooth w-full">
                        <!-- Tarjetas generadas por JS -->
                    </div>
                </div>

                <!-- Columna Derecha: Plano de Stands -->
                <div class="lg:col-span-5 bg-slate-50 p-6 rounded-3xl shadow-lg border-t-4 border-dark flex flex-col items-center justify-start sticky top-24 min-w-0 w-full h-[600px]">
                    <div class="text-center mb-4 w-full">
                        <h3 class="font-black text-slate-800 text-xl">📍 Plano de la Feria</h3>
                        <p id="info-hover-mapa" class="text-xs font-bold text-slate-500 h-5 mt-1 transition-all">Haz clic en una tarjeta para ubicar su stand</p>
                    </div>

                    <!-- Contenedor del plano dinámico -->
                    <div class="w-full flex-grow flex justify-center items-center bg-white rounded-2xl border border-slate-200/60 p-4 relative overflow-hidden shadow-inner">
